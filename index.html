<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wish List de Fanny</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Cinzel:wght@500;600&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">MA WISH LIST POUR</div>
    <h1>My Birthday</h1>
    <div class="age">32 ans</div>
    <div class="date">SAMEDI 14 NOVEMBRE 2026<span>À LA MAISON · À PARTIR DE 11H30</span></div>
  </header>

  <div class="intro">Quelques idées si vous voulez me gâter. <strong>Réservez</strong> le cadeau que vous choisissez pour éviter les doublons&nbsp;: les autres le verront pris, et moi je ne vois rien.</div>

  <div class="banner" id="banner" role="status" hidden></div>

  <ul class="list" id="list"></ul>

  <footer>
    <div class="sign">J'ai hâte de vous retrouver !</div>
    <div class="small" id="note"></div>
  </footer>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
